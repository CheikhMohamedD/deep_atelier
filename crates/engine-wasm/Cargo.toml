[package]
name = "deep-atelier-engine-wasm"
version = "0.1.0"
description = "Moteur de l'éditeur Deep Atelier en WebAssembly : session de l'IR, rendu du canvas, validation"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
ir = { package = "deep-atelier-ir", path = "../ir" }
compiler-web = { package = "deep-atelier-compiler-web", path = "../compiler-web" }
serde.workspace = true
serde_json.workspace = true
# Même version que wasm-bindgen-cli (packages/engine/build.mjs le vérifie).
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
