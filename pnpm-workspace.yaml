packages:
  - apps/*
  - packages/*
  - tools/*

# Scripts d'installation autorisés (pnpm 11+) ; les autres sont ignorés.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  # Binaires natifs fournis par des paquets précompilés (dépendances de next-intl).
  "@parcel/watcher": false
  "@swc/core": false

minimumReleaseAgeExclude:
  - vite@8.3.4
